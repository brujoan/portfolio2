<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Finder Portfolio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="finder-window">
    <header class="toolbar">
      <div class="traffic-lights" aria-hidden="true">
        <span class="red"></span><span class="yellow"></span><span class="green"></span>
      </div>

      <div class="nav-controls">
        <button class="icon-btn" id="backBtn" aria-label="Atrás">‹</button>
        <button class="icon-btn" id="forwardBtn" aria-label="Adelante">›</button>
      </div>

      <div class="title-block">
        <strong id="windowTitle">Portfolio</strong>
        <small>Audiovisual</small>
      </div>

      <div class="toolbar-actions">
        <button class="icon-btn">▦</button>
        <button class="icon-btn">☷</button>
        <button class="icon-btn active">▥</button>
        <div class="search-wrap">
          <span>⌕</span>
          <input id="searchInput" placeholder="Buscar proyectos..." />
        </div>
      </div>
    </header>

    <section class="workspace">
      <aside class="sidebar">
        <div class="brand">
          <div class="signature">JB</div>
          <div>
            <strong>JOAN BRU</strong>
            <small>AUDIOVISUAL</small>
          </div>
        </div>

        <nav>
          <p>Favoritos</p>
          <button class="side-item active" data-view="home"><span>📁</span> Portfolio</button>
          <button class="side-item" data-view="reels"><span>🎞️</span> Reels</button>
          <button class="side-item" data-view="producto"><span>📷</span> Foto producto</button>
          <button class="side-item" data-view="personales"><span>✦</span> Proyectos personales</button>

          <p>Biblioteca</p>
          <button class="side-item" data-view="todo"><span>◉</span> Todo</button>
          <button class="side-item" data-view="contacto"><span>↗</span> Contacto</button>
        </nav>

        <div class="sidebar-note">Ideas, imágenes y movimiento.</div>
      </aside>

      <section class="columns">
        <div class="browser-column folders-column">
          <div class="column-header">Categorías</div>
          <div id="folderList"></div>
        </div>

        <div class="browser-column items-column">
          <div class="column-header" id="itemHeader">Contenido</div>
          <div id="itemList"></div>
        </div>

        <section class="preview-panel" id="previewPanel">
          <div class="preview-empty">
            <div class="empty-icon">⌘</div>
            <h2>Selecciona una pieza</h2>
            <p>El contenido aparecerá aquí como si estuvieras navegando por Finder.</p>
          </div>
        </section>
      </section>
    </section>

    <footer class="statusbar">
      <div id="breadcrumb">Macintosh HD › Portfolio</div>
      <div id="statusText">3 carpetas</div>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
