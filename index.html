<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Portfolio Joan Brú</title>
  <link rel="stylesheet" href="styles.css?v=1.0.10" />
  <link rel="stylesheet" href="language.css?v=1.0.10" />
  <link rel="stylesheet" href="desktop.css?v=1.0.10" />
  <link rel="stylesheet" href="mobile.css?v=1.0.10" />
  <link rel="stylesheet" href="lightbox.css?v=1.0.10" />
</head>
<body>
  <main class="finder-window">
    <header class="toolbar">
      <div class="traffic-lights" aria-hidden="true">
        <span class="red"></span><span class="yellow"></span><span class="green"></span>
      </div>

      <div class="nav-controls">
        <button class="icon-btn" id="backBtn" aria-label="Enrere">‹</button>
        <button class="icon-btn" id="forwardBtn" aria-label="Endavant">›</button>
      </div>

      <div class="title-block">
        <strong id="windowTitle">Portfolio</strong>
        <small>Audiovisual</small>
      </div>

      <div class="toolbar-actions">
        <button class="icon-btn">▦</button>
        <button class="icon-btn">☷</button>
        <button class="icon-btn active">▥</button>

        <div class="language-switcher" role="group" aria-label="Idioma">
          <button class="language-btn active" type="button" data-lang="ca" aria-pressed="true">CA</button>
          <button class="language-btn" type="button" data-lang="es" aria-pressed="false">ES</button>
          <button class="language-btn" type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>

        <div class="search-wrap">
          <span>⌕</span>
          <input id="searchInput" placeholder="Cerca projectes..." />
        </div>
      </div>
    </header>

    <section class="workspace">
      <aside class="sidebar">
        <div class="brand">
          <div class="signature">JB</div>
          <div>
            <strong><a href="https://www.instagram.com/joanbruu/" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:none">JOAN BRÚ</a></strong>
          </div>
        </div>

        <nav>
          <p data-ui="favorites">Preferits</p>
          <button class="side-item active" data-view="proyectos"><span class="side-icon">✦</span><span class="side-label">Projectes</span></button>
          <button class="side-item" data-view="vertical"><span class="side-icon">🎞️</span><span class="side-label">Vertical</span></button>
          <button class="side-item" data-view="fotos"><span class="side-icon">📷</span><span class="side-label">Fotos</span></button>
          <button class="side-item" data-view="retransmisiones"><span class="side-icon">◉</span><span class="side-label">Retransmissions esportives</span></button>
          <button class="side-item" data-view="musica"><span class="side-icon">♫</span><span class="side-label">Producció musical</span></button>

          <p data-ui="library">Biblioteca</p>
          <button class="side-item" data-view="todo"><span class="side-icon">◉</span><span class="side-label">Tot</span></button>
          <button class="side-item" data-view="contacto"><span class="side-icon">↗</span><span class="side-label">Contacte</span></button>
        </nav>

        <div class="sidebar-note">
          <span data-ui="sidebar-note">Barcelona, Catalunya, Espanya.</span>
          <!-- Incrementar esta versión en cada cambio publicado -->
          <span class="sidebar-version">v1.0.10</span>
        </div>
      </aside>

      <section class="columns">
        <div class="browser-column folders-column">
          <div class="column-header" data-ui="categories">Categories</div>
          <div id="folderList"></div>
        </div>

        <div class="browser-column photo-folders-column" id="photoFolderColumn">
          <div class="column-header" id="photoFolderHeader">Fotos</div>
          <div id="photoFolderList"></div>
        </div>

        <div class="browser-column items-column">
          <div class="column-header" id="itemHeader">Contingut</div>
          <div id="itemList"></div>
        </div>

        <button class="mobile-back" id="mobileBackBtn" type="button" aria-label="Enrere">‹</button>

        <section class="preview-panel" id="previewPanel">
          <div class="preview-empty">
            <div class="empty-icon">⌘</div>
            <h2>Selecciona una peça</h2>
            <p>El contingut apareixerà aquí.</p>
          </div>
        </section>
      </section>
    </section>

    <footer class="statusbar">
      <div id="breadcrumb">Macintosh HD › Portfolio</div>
      <div id="statusText">3 carpetes</div>
    </footer>
  </main>

  <script src="content.js?v=1.0.10"></script>
  <script src="app.js?v=1.0.10"></script>
  <script src="desktop.js?v=1.0.10"></script>
  <script src="mobile.js?v=1.0.10"></script>
  <script src="lightbox.js?v=1.0.10"></script>
</body>
</html>
